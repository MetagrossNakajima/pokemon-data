name: Publish versioned Champions Pokedex
on:
  push:
    branches: [main]
    paths: ["data/pokedex/**", "scripts/champions/**", ".github/workflows/deploy-pokedex.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-pokedex
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release
        run: python3 scripts/champions/validate-release.py
      - name: Publish immutable body, verify, then switch manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BUCKET: ${{ vars.CLOUDFLARE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .dataVersion data/pokedex/manifest.json)
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          target="s3://${CLOUDFLARE_BUCKET}/data/pokedex"
          # Refuse to change an already published version, including on workflow retry.
          aws s3api list-objects-v2 --bucket "$CLOUDFLARE_BUCKET" --prefix "data/pokedex/$version.json" --endpoint-url="$endpoint" --region auto --output json > /tmp/pokedex-objects.json
          if jq -e --arg key "data/pokedex/$version.json" 'any(.Contents[]?; .Key == $key)' /tmp/pokedex-objects.json > /dev/null; then
            aws s3 cp "$target/$version.json" /tmp/pokedex-existing.json --endpoint-url="$endpoint" --region auto
            cmp "data/pokedex/$version.json" /tmp/pokedex-existing.json
          else
            aws s3 cp "data/pokedex/$version.json" "$target/$version.json" --endpoint-url="$endpoint" --region auto --content-type application/json --cache-control 'public,max-age=31536000,immutable'
          fi
          aws s3 cp "$target/$version.json" /tmp/pokedex-verified.json --endpoint-url="$endpoint" --region auto
          cmp "data/pokedex/$version.json" /tmp/pokedex-verified.json
          aws s3 cp data/pokedex/manifest.json "$target/manifest.json" --endpoint-url="$endpoint" --region auto --content-type application/json --cache-control no-store
